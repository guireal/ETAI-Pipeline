data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"
  drop_columns: ["id", "decile_score", "score_text"]

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - fbeta_2
    - roc_auc
    - average_precision
  selection_metric: "roc_auc"
  n_jobs: 1

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

preprocessing:
  encoder: "target"
  scaler: "robust"
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

model:
  type: "naive_bayes"
  params: {}

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth:
        type: int
        low: 1
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__criterion:
        type: categorical
        choices: ["gini", "entropy"]

    random_forest:
      model__max_depth:
        type: int
        low: 2
        high: 30
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__max_features:
        type: categorical
        choices: ["sqrt", 0.5, 1.0]

    oblique_random_forest:
      model__estimator__tree__max_depth:
        type: int
        low: 2
        high: 30
      model__estimator__tree__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__estimator__project__n_components:
        type: int
        low: 3
        high: 10

    adaboost:
      model__estimator__max_depth:
        type: int
        low: 1
        high: 8
      model__n_estimators:
        type: int
        low: 25
        high: 400
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true

    gradient_boosting:
      model__n_estimators:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_depth:
        type: int
        low: 1
        high: 6
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__subsample:
        type: float
        low: 0.5
        high: 1.0

    hist_gradient_boosting:
      model__max_iter:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_leaf_nodes:
        type: int
        low: 2
        high: 63
        log: true
      model__min_samples_leaf:
        type: int
        low: 5
        high: 200
        log: true
      model__l2_regularization:
        type: float
        low: 0.000001
        high: 10.0
        log: true

    naive_bayes:
      model__var_smoothing:
        type: float
        low: 0.000000000001
        high: 0.1
        log: true

output:
  results_dir: "results"
  scoreboard: "results/runs.csv"